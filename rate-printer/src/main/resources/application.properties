spring.application.name=rate-printer
server.port=${SERVER_PORT:8081}
grpc.client.currency-rate.address=discovery:///currency-rate-provider
grpc.client.currency-rate.negotiation-type=plaintext
spring.cloud.zookeeper.connect-string=${ZOOKEEPER_HOST:localhost}:2181
spring.cloud.zookeeper.discovery.register=false

# Actuator - expose health, info, prometheus endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# Tag all metrics with the application name (overridable via env)
management.metrics.tags.application=${METRICS_APPLICATION:${spring.application.name}}
