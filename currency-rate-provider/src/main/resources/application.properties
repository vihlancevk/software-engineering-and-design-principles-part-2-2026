spring.application.name=currency-rate-provider
server.port=${SERVER_PORT:8080}
grpc.server.port=9090
spring.cloud.zookeeper.connect-string=${ZOOKEEPER_HOST:localhost}:2181

# Actuator - expose health, info, prometheus endpoints
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# Tag all metrics with the application name (overridable via env for multi-instance deployments)
management.metrics.tags.application=${METRICS_APPLICATION:${spring.application.name}}

# Enable histogram buckets for grpc duration metric (required for histogram_quantile in Prometheus)
management.metrics.distribution.percentiles-histogram.grpc.server.request.duration=true
# Also publish client-side percentiles as gauge metrics
management.metrics.distribution.percentiles.grpc.server.request.duration=0.5,0.75,0.95,0.99
# SLO buckets for precise bucket boundaries
management.metrics.distribution.slo.grpc.server.request.duration=5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s
