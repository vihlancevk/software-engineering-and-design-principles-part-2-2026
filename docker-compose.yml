# docker-compose.yml — Factor X: Dev/Prod Parity
#
# Shared config for all environments. Never run alone — always compose with
# an environment-specific overlay that supplies image: or build: for app services:
#   Development : -f docker-compose.yml -f docker-compose.dev.yml        (./dev.sh)
#   Production  : -f docker-compose.yml -f releases/<id>/docker-compose.release.yml  (./run.sh)

services:
  zookeeper:
    build:
      context: ./monitoring/zookeeper
    ports:
      - "2181:2181"
      - "7070:7070"
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: mntr,conf,ruok
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── App services — shared runtime config ───────────────────
  # image: / build: is supplied by the environment overlay.
  # Both provider instances register as "currency-rate-provider" in ZooKeeper
  # so the client discovers them via round-robin.
  service1:
    ports:
      - "8081:8080"
      - "9090:9090"
    environment:
      ZOOKEEPER_HOST: zookeeper
      METRICS_APPLICATION: service1
    depends_on:
      zookeeper:
        condition: service_healthy

  service2:
    ports:
      - "8082:8080"
      - "9092:9090"
    environment:
      ZOOKEEPER_HOST: zookeeper
      METRICS_APPLICATION: service2
    depends_on:
      zookeeper:
        condition: service_healthy

  client:
    ports:
      - "8083:8081"
    environment:
      ZOOKEEPER_HOST: zookeeper
      METRICS_APPLICATION: client
    depends_on:
      zookeeper:
        condition: service_healthy
      service1:
        condition: service_started
      service2:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - service1
      - service2
      - client

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  pact-broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: pact_broker
      POSTGRES_DB: pact_broker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact_broker"]
      interval: 5s
      timeout: 5s
      retries: 5

  pact-broker:
    image: pactfoundation/pact-broker:latest
    ports:
      - "9292:9292"
    depends_on:
      pact-broker-db:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact_broker:pact_broker@pact-broker-db/pact_broker
      PACT_BROKER_LOG_LEVEL: INFO

volumes:
  grafana_data:
